name: Release Shim Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build Artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git reset --hard HEAD

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable branch commit (no semver tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "shim -> target"

      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust shim (release)
        working-directory: shim
        run: cargo build --locked --release

      - name: Package release artifact
        shell: pwsh
        run: |
          $platform = switch ("${{ runner.os }}") {
            "Linux" { "linux" }
            "macOS" { "macos" }
            "Windows" { "windows" }
            default { throw "Unsupported OS: ${{ runner.os }}" }
          }

          $libCandidates = switch ("${{ runner.os }}") {
            "Linux" { @("libchroma_shim.so", "libchroma_go_shim.so") }
            "macOS" { @("libchroma_shim.dylib", "libchroma_go_shim.dylib") }
            "Windows" { @("chroma_shim.dll", "chroma_go_shim.dll") }
            default { throw "Unsupported OS: ${{ runner.os }}" }
          }

          $libName = $null
          foreach ($candidate in $libCandidates) {
            $candidatePath = Join-Path $env:GITHUB_WORKSPACE "shim/target/release/$candidate"
            if (Test-Path $candidatePath) {
              $libName = $candidate
              break
            }
          }
          if ($null -eq $libName) {
            throw "No expected shim library found. Checked: $($libCandidates -join ', ')"
          }

          $arch = switch ("${{ runner.arch }}") {
            "X64" { "amd64" }
            "ARM64" { "arm64" }
            default { "${{ runner.arch }}".ToLowerInvariant() }
          }

          $artifactBase = "chroma-shim-$platform-$arch"
          $stagingDir = Join-Path $env:RUNNER_TEMP $artifactBase
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "shim/target/release/$libName") -Destination (Join-Path $stagingDir $libName) -Force

          $archiveName = "$artifactBase.tar.gz"
          $archivePath = Join-Path $distDir $archiveName
          tar -C $stagingDir -czf $archivePath .

          Write-Host "Created $archiveName"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shim-${{ runner.os }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish release assets and signed R2 artifacts
    needs: build-artifacts
    # publish only on tag pushes; workflow_dispatch is for matrix build verification
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download artifact bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: shim-*
          path: dist
          merge-multiple: true

      - name: Normalize artifact names
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PROJECT: chroma-go-local
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(chroma-shim-*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts were downloaded"
            exit 1
          fi
          for f in "${files[@]}"; do
            base="${f%.tar.gz}"
            suffix="${base#chroma-shim-}"
            os="${suffix%-*}"
            arch="${suffix##*-}"
            if [ "${os}" = "macos" ]; then
              os="darwin"
            fi
            mv "${f}" "${PROJECT}-${TAG}-${os}-${arch}.tar.gz"
          done
          ls -lah

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          ls -lah

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign and verify artifacts
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          IDENTITY="https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}"
          ISSUER="https://token.actions.githubusercontent.com"

          for f in *.tar.gz; do
            cosign sign-blob --yes \
              --oidc-issuer "${ISSUER}" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"

            cosign verify-blob \
              --signature "${f}.sig" \
              --certificate "${f}.pem" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${f}"
          done

          cosign sign-blob --yes \
            --oidc-issuer "${ISSUER}" \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

          cosign verify-blob \
            --signature SHA256SUMS.sig \
            --certificate SHA256SUMS.pem \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            SHA256SUMS

      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          PROJECT: chroma-go-local
          VERSION: ${{ github.ref_name }}
          BUCKET: releases
        run: |
          set -euo pipefail
          aws --version

          PREFIX="${PROJECT}/${VERSION}"
          aws s3 cp dist/ "s3://${BUCKET}/${PREFIX}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}"

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "checksums_url": "${PROJECT}/${VERSION}/SHA256SUMS"
          }
          EOF

          aws s3 cp /tmp/latest.json "s3://${BUCKET}/${PROJECT}/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"

      - name: Purge latest.json from CDN cache
        if: vars.CF_ZONE_ID != '' && secrets.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: chroma-go-local
          RELEASES_DOMAIN: ${{ vars.RELEASES_DOMAIN || 'releases.amikos.tech' }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"https://${RELEASES_DOMAIN}/${PROJECT}/latest.json\"]}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem

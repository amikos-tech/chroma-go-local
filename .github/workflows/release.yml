name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release/backfill (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Single source of truth for the ref being released. Both `actions/checkout`
  # steps and the signing-identity guard read this, so the ref that gets built
  # and the ref the guard validates cannot drift apart.
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

jobs:
  build-artifacts:
    name: Build Artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git reset --hard HEAD

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned action commit
        with:
          toolchain: 1.93.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "shim -> target"

      - name: Set up protoc
        shell: bash
        env:
          PROTOC_VERSION: "31.1"
        run: |
          # Inlined rather than a local composite action: this job checks out an
          # older tag on backfill, where .github/actions/ would not exist.
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              asset="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
              sha="96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065" ;;
            macOS)
              asset="protoc-${PROTOC_VERSION}-osx-universal_binary.zip"
              sha="99ea004549c139f46da5638187a85bbe422d78939be0fa01af1aa8ab672e395f" ;;
            Windows)
              asset="protoc-${PROTOC_VERSION}-win64.zip"
              sha="70381b116ab0d71cb6a5177d9b17c7c13415866603a0fd40d513dafe32d56c35" ;;
            *)
              echo "::error::Unsupported runner OS: ${RUNNER_OS}"
              exit 1 ;;
          esac

          tmp="${RUNNER_TEMP}"
          if command -v cygpath >/dev/null 2>&1; then
            tmp="$(cygpath -u "${RUNNER_TEMP}")"
          fi

          curl --fail-with-body --retry 3 --retry-all-errors --max-time 180 -sSL \
            -o "${tmp}/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${asset}"

          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sha}  ${tmp}/protoc.zip" | sha256sum -c -
          else
            echo "${sha}  ${tmp}/protoc.zip" | shasum -a 256 -c -
          fi

          if command -v unzip >/dev/null 2>&1; then
            unzip -q "${tmp}/protoc.zip" -d "${tmp}/protoc"
          else
            7z x -y -o"${tmp}/protoc" "${tmp}/protoc.zip" >/dev/null
          fi

          bin="${tmp}/protoc/bin"
          if command -v cygpath >/dev/null 2>&1; then
            bin="$(cygpath -w "${bin}")"
          fi
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Verify protoc
        run: protoc --version

      - name: Build Rust shim (release)
        working-directory: shim
        run: cargo build --locked --release

      - name: Package release artifact
        shell: pwsh
        run: |
          $platform = switch ("${{ runner.os }}") {
            "Linux" { "linux" }
            "macOS" { "macos" }
            "Windows" { "windows" }
            default { throw "Unsupported OS: ${{ runner.os }}" }
          }

          $libCandidates = switch ("${{ runner.os }}") {
            "Linux" { @("libchroma_shim.so", "libchroma_go_shim.so") }
            "macOS" { @("libchroma_shim.dylib", "libchroma_go_shim.dylib") }
            "Windows" { @("chroma_shim.dll", "chroma_go_shim.dll") }
            default { throw "Unsupported OS: ${{ runner.os }}" }
          }

          $libName = $null
          foreach ($candidate in $libCandidates) {
            $candidatePath = Join-Path $env:GITHUB_WORKSPACE "shim/target/release/$candidate"
            if (Test-Path $candidatePath) {
              $libName = $candidate
              break
            }
          }
          if ($null -eq $libName) {
            throw "No expected shim library found. Checked: $($libCandidates -join ', ')"
          }

          $arch = switch ("${{ runner.arch }}") {
            "X64" { "amd64" }
            "ARM64" { "arm64" }
            default { "${{ runner.arch }}".ToLowerInvariant() }
          }

          $artifactBase = "chroma-shim-$platform-$arch"
          $stagingDir = Join-Path $env:RUNNER_TEMP $artifactBase
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "shim/target/release/$libName") -Destination (Join-Path $stagingDir $libName) -Force

          $archiveName = "$artifactBase.tar.gz"
          $archivePath = Join-Path $distDir $archiveName
          tar -C $stagingDir -czf $archivePath .

          Write-Host "Created $archiveName"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shim-${{ runner.os }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

  build-java-artifacts:
    name: Build Java Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 22
        # Gradle runs on Java 22, while the Java 17 toolchain remains available
        # for modules that compile or test against the older release target.
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Compute release version
        id: compute_version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Java release jars
        shell: bash
        run: |
          set -euo pipefail
          cd java
          gradle --no-daemon \
            -PreleaseVersion="${{ steps.compute_version.outputs.version }}" \
            :core:jar \
            :jna:jar \
            :panama:jar \
            -x test

      - name: Stage Java release jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.compute_version.outputs.version }}"
          cp "java/core/build/libs/core-${VERSION}.jar" "dist/chroma-local-java-core-${VERSION}.jar"
          cp "java/jna/build/libs/jna-${VERSION}.jar" "dist/chroma-local-java-jna-${VERSION}.jar"
          cp "java/panama/build/libs/panama-${VERSION}.jar" "dist/chroma-local-java-panama-${VERSION}.jar"
          ls -lah dist

      - name: Upload Java artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-release
          path: |
            dist/*.jar
          if-no-files-found: error

  publish-release:
    name: Publish release assets and signed R2 artifacts
    needs:
      - build-artifacts
      - build-java-artifacts
    # publish on tag pushes and manual tag backfills
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download artifact bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shim-*
          path: dist
          merge-multiple: true

      - name: Download Java artifact bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-release
          path: dist

      - name: Normalize artifact names
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          PROJECT: chroma-go-local
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(chroma-shim-*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts were downloaded"
            exit 1
          fi
          for f in "${files[@]}"; do
            base="${f%.tar.gz}"
            suffix="${base#chroma-shim-}"
            os="${suffix%-*}"
            arch="${suffix##*-}"
            if [ "${os}" = "macos" ]; then
              os="darwin"
            fi
            mv "${f}" "${PROJECT}-${TAG}-${os}-${arch}.tar.gz"
          done
          ls -lah

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( *.tar.gz *.jar )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found for checksum generation"
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          ls -lah

      # Guard for issue #100: cosign derives the certificate identity from
      # github.workflow_ref (the ref the workflow FILE was loaded from), not the
      # ref that actions/checkout pulled. Dispatching from main therefore signs
      # tag content with a refs/heads/main identity, forcing downstream consumers
      # to widen their cosign allowlist. Refuse to sign on mismatch.
      # The whole identity (repo + workflow path + ref) is compared exactly:
      # splitting workflow_ref on '@' is spoofable because git refs may legally
      # contain '@', so a branch named "x@refs/tags/v1.2.3" would forge a match.
      # NOTE: this holds only while the signing job lives in this file — if it
      # ever moves to a reusable workflow the identity follows job_workflow_ref.
      - name: Verify signing identity matches released ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/release.yml@${{ env.RELEASE_REF }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${WORKFLOW_REF}" != "${EXPECTED_WORKFLOW_REF}" ]; then
            echo "::error title=Signing identity mismatch::Artifacts would be signed as ${WORKFLOW_REF} but must be ${EXPECTED_WORKFLOW_REF}"
            echo "Refusing to sign: the cosign certificate identity must match the released ref (see issue #100)."
            echo "Re-run the release from the tag itself:"
            echo "  gh workflow run release.yml --ref ${RELEASE_TAG} -f release_tag=${RELEASE_TAG}"
            exit 1
          fi
          echo "Signing identity ${WORKFLOW_REF} matches the released ref."

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Override the action default (v3.0.3) to v3.0.5 for security fixes and deterministic bundle output.
          cosign-release: v3.0.5

      - name: Sign and verify artifacts
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cd dist
          IDENTITY="https://github.com/${WORKFLOW_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          shopt -s nullglob
          files=( *.tar.gz *.jar )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found for signing"
            exit 1
          fi

          cosign version

          for f in "${files[@]}"; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore.json" \
              --use-signing-config \
              "${f}"

            cosign verify-blob \
              --bundle "${f}.sigstore.json" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              --use-signed-timestamps \
              "${f}"
          done

          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            --use-signing-config \
            SHA256SUMS

          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            --use-signed-timestamps \
            SHA256SUMS

      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          PROJECT: chroma-go-local
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          BUCKET: releases
          RELEASES_DOMAIN: ${{ vars.RELEASES_DOMAIN || 'releases.amikos.tech' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          aws --version

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "R2 credentials are incomplete (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT are required)."
            exit 1
          fi

          PREFIX="${PROJECT}/${VERSION}"
          aws s3 cp dist/ "s3://${BUCKET}/${PREFIX}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}"

          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg version "${VERSION}" \
            --arg date "${RELEASE_DATE}" \
            --arg checksums_url "${PROJECT}/${VERSION}/SHA256SUMS" \
            --arg checksums_full_url "https://${RELEASES_DOMAIN}/${PROJECT}/${VERSION}/SHA256SUMS" \
            '{version: $version, date: $date, checksums_url: $checksums_url, checksums_full_url: $checksums_full_url}' > /tmp/latest.json

          aws s3 cp /tmp/latest.json "s3://${BUCKET}/${PROJECT}/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"

          EXISTING_RELEASES_JSON="$(mktemp)"
          if ! aws s3 cp "s3://${BUCKET}/${PROJECT}/releases.json" "${EXISTING_RELEASES_JSON}" \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then
            rm -f "${EXISTING_RELEASES_JSON}"
          fi

          ./scripts/build_releases_index.sh \
            --existing "${EXISTING_RELEASES_JSON}" \
            --output /tmp/releases.json \
            --project "${PROJECT}" \
            --version "${VERSION}" \
            --date "${RELEASE_DATE}" \
            --max 100

          IDENTITY="https://github.com/${WORKFLOW_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign sign-blob --yes \
            --bundle /tmp/releases.json.sigstore.json \
            --use-signing-config \
            /tmp/releases.json

          cosign verify-blob \
            --bundle /tmp/releases.json.sigstore.json \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            --use-signed-timestamps \
            /tmp/releases.json

          aws s3 cp /tmp/releases.json "s3://${BUCKET}/${PROJECT}/releases.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"
          aws s3 cp /tmp/releases.json.sigstore.json "s3://${BUCKET}/${PROJECT}/releases.json.sigstore.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json"

      - name: Purge release metadata from CDN cache
        shell: bash
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: chroma-go-local
          RELEASES_DOMAIN: ${{ vars.RELEASES_DOMAIN || 'releases.amikos.tech' }}
        run: |
          set -euo pipefail

          PURGE_CODE="not-requested"
          PURGE_BODY_FILE=""

          warn_purge_failure() {
            local reason=$1
            local response_body="<empty>"
            local response_size=""
            local truncation_marker=""

            if [ -n "${PURGE_BODY_FILE}" ] && [ -s "${PURGE_BODY_FILE}" ]; then
              if ! response_body="$(
                LC_ALL=C head -c 512 "${PURGE_BODY_FILE}" 2>/dev/null \
                  | LC_ALL=C tr '\r\n' '  ' 2>/dev/null
              )"; then
                response_body="<unreadable>"
              fi

              if response_size="$(LC_ALL=C wc -c < "${PURGE_BODY_FILE}" 2>/dev/null)"; then
                response_size="${response_size//[[:space:]]/}"
                if [[ "${response_size}" =~ ^[0-9]+$ ]] && [ "${response_size}" -gt 512 ]; then
                  truncation_marker="...[truncated]"
                fi
              fi
            fi

            printf 'CDN purge diagnostic: HTTP status=%s; response body=%s\n' \
              "${PURGE_CODE}" "${response_body}${truncation_marker}"
            printf '::warning title=CDN cache not purged::%s\n' "${reason}"
            exit 0
          }

          MISSING=""
          if [ -z "${CF_ZONE_ID:-}" ]; then
            MISSING="${MISSING}, CF_ZONE_ID (repository variable)"
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            MISSING="${MISSING}, CLOUDFLARE_API_TOKEN (repository secret)"
          fi
          MISSING="${MISSING#, }"
          if [ -n "${MISSING}" ]; then
            warn_purge_failure \
              "Missing ${MISSING}. Add each named item under repository Settings > Secrets and variables > Actions, then rerun the release for the same tag. Release metadata can remain stale until a successful purge."
          fi

          if ! command -v jq >/dev/null 2>&1; then
            warn_purge_failure \
              "jq is required on the runner for validating the Cloudflare cache purge response. Install jq, then rerun the release for the same tag. Release publication will continue."
          fi

          if ! PURGE_BODY_FILE=$(mktemp); then
            warn_purge_failure \
              "Unable to create a temporary response file for the Cloudflare cache purge. Release publication will continue."
          fi
          trap 'rm -f "${PURGE_BODY_FILE}"' EXIT

          PURGE_CODE=""
          if ! PURGE_CODE=$(curl -sS \
              --retry 3 \
              --retry-all-errors \
              --max-time 180 \
              -o "${PURGE_BODY_FILE}" \
              -w '%{http_code}' \
              -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://${RELEASES_DOMAIN}/${PROJECT}/latest.json\",\"https://${RELEASES_DOMAIN}/${PROJECT}/releases.json\"]}"); then
            PURGE_CODE="${PURGE_CODE:-000}"
            warn_purge_failure \
              "Cloudflare cache purge transport request failed after retries. Check runner connectivity and Cloudflare availability, then retry the release. Release publication will continue."
          fi

          case "${PURGE_CODE}" in
            2[0-9][0-9])
              ;;
            401)
              warn_purge_failure \
                "Cloudflare rejected cache purge authentication. Replace or correct CLOUDFLARE_API_TOKEN, then rerun the release. Release publication will continue."
              ;;
            403)
              warn_purge_failure \
                "Cloudflare denied the cache purge. Grant Cache Purge permission for the selected zone and verify the token/zone association. Release publication will continue."
              ;;
            408|429|5[0-9][0-9])
              warn_purge_failure \
                "Cloudflare cache purge failed after retries because of a timeout, rate limit, or server error. Retry the release after the service recovers. Release publication will continue."
              ;;
            *)
              warn_purge_failure \
                "Cloudflare cache purge returned an unexpected non-success HTTP status. Review the diagnostic and Cloudflare configuration before retrying. Release publication will continue."
              ;;
          esac

          if [ ! -s "${PURGE_BODY_FILE}" ]; then
            warn_purge_failure \
              "Cloudflare cache purge returned an empty response body. Retry the release and check Cloudflare service health. Release publication will continue."
          fi

          if ! jq empty "${PURGE_BODY_FILE}" >/dev/null 2>&1; then
            warn_purge_failure \
              "Cloudflare cache purge returned malformed JSON. Retry the release and check Cloudflare service health. Release publication will continue."
          fi

          if ! jq -e '.success == true' "${PURGE_BODY_FILE}" >/dev/null 2>&1; then
            warn_purge_failure \
              "Cloudflare cache purge API response did not report success:true. Review the diagnostic and Cloudflare response before retrying. Release publication will continue."
          fi

          echo "Cloudflare release metadata purge succeeded."
          exit 0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          overwrite_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.jar
            dist/SHA256SUMS
            dist/*.sigstore.json
